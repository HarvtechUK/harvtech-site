name: Portal Platform

# Triggered only when portal-platform/ files change.
#
# feat/* ──PR──→ dev   Stage 1 only
# dev    ──PR──→ main  Stage 1 + Stage 2 plan
# main   push          Stage 1 + Stage 2 plan + apply
# workflow_dispatch    Stage 1 + Stage 2 plan + apply (from main only)
# schedule             Stage 1 only

on:
  push:
    branches: [main, dev]
    paths:
      - 'portal-platform/**'
      - 'modules/**'
      - '.checkov.yaml'
      - '.trivyignore'
      - '.tflint.hcl'
      - '.github/workflows/portal-platform.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'portal-platform/**'
      - 'modules/**'
      - '.checkov.yaml'
      - '.trivyignore'
      - '.tflint.hcl'
      - '.github/workflows/portal-platform.yml'
  schedule:
    - cron: '42 6 * * *'
  workflow_dispatch:

# Serialise runs of this workflow — concurrent runs race each other for
# the Terraform state lock. Queued, not cancelled: every push still gets
# its run, just one at a time.
concurrency:
  group: portal-platform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

# ── Stage 1: Validation (no Azure credentials) ───────────────────────────────

jobs:

  checkov:
    name: Checkov (portal-platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bridgecrewio/checkov-action@v12.3114.0
        with:
          framework: terraform
          directory: portal-platform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
          config_file: .checkov.yaml
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov-portal-platform

  trivy:
    name: Trivy (portal-platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: portal-platform
          format: sarif
          output: trivy.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-portal-platform

  tflint:
    name: tflint (portal-platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Init tflint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tflint
        run: tflint --format sarif --chdir portal-platform > tflint-portal-platform.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('tflint-portal-platform.sarif') != ''
        with:
          sarif_file: tflint-portal-platform.sarif
          category: tflint-portal-platform

  validate-terraform:
    name: Validate Terraform (portal-platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Terraform init (no backend)
        run: terraform -chdir=portal-platform init -backend=false
      - name: Terraform fmt check
        run: terraform -chdir=portal-platform fmt -check -recursive
      - name: Terraform validate
        run: terraform -chdir=portal-platform validate

# ── Stage 2: Plan & Apply (main branch only) ─────────────────────────────────

  terraform-portal-platform:
    name: Terraform portal-platform
    needs: [checkov, trivy, tflint, validate-terraform]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-platform
    env:
      TFVARS: env/prd.tfvars
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init
        run: terraform init
      - name: Terraform plan
        run: terraform plan -out=tfplan -var-file=$TFVARS
      - name: Terraform apply
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve tfplan
