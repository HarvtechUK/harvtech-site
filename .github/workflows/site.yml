name: Site

# No IaC in this stack so Checkov/Trivy/tflint don't apply — only Snyk
# (npm deps) and the Astro build.
#
# This workflow starts on EVERY pull request into dev or main, and then
# decides for itself whether the site changed (the `changes` job below).
# The reason is branch protection: "Snyk (Open Source)" and "Build site"
# are required checks. A required check that never starts does not count
# as passed — GitHub shows it as "Expected — waiting for status to be
# reported" for ever, and the pull request cannot merge. That is what a
# `paths:` filter on the pull_request trigger did to every pull request
# that only touched the portal. A job that starts and is then SKIPPED
# does count as passed, so the two jobs now always report: they run for
# real when site/ changed and are skipped when it did not.
#
# deploy-site reads the storage account name from infra Terraform state
# at deploy time rather than hard-coding it.
#
# feat/* ──PR──→ dev   Stage 1 only  (Snyk + build)
# dev    ──PR──→ main  Stage 1 only  (no Terraform plan for site stack)
# main   push          Stage 1 + deploy
# workflow_dispatch    Stage 1 + deploy (from main only)
# schedule             Stage 1 only  (nightly Snyk CVE sweep)

on:
  push:
    branches: [main, dev]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  # No `paths:` here on purpose — see the note at the top. The paths
  # live in the `changes` job instead; keep the two lists the same.
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

# Serialise runs of this workflow — concurrent runs race each other for
# the Terraform state lock (seen when several Dependabot merges landed
# in quick succession). Queued, not cancelled: every push still gets
# its run, just one at a time.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

# ── Stage 1: Validation ───────────────────────────────────────────────────────

jobs:

  # Answers one question: does this run need to test the site?
  #   push / schedule / manual run -> yes, always (the push trigger has
  #                                   already filtered on site/ paths)
  #   pull request                 -> only if it touches site/ or this file
  changes:
    name: Site changed?
    runs-on: ubuntu-latest
    # This job runs on every pull request, so it gets the least it needs:
    # it reads the repository and nothing else.
    permissions:
      contents: read
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      # On a pull request GitHub checks out a temporary merge commit: the
      # base branch with the pull request merged in. Its first parent is
      # the base branch, so "first parent vs this commit" is exactly what
      # the pull request changes. Depth 2 fetches that parent too.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Did this run touch the site?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          site=true
          if [ "$EVENT" = "pull_request" ]; then
            # If the comparison cannot be made, stay on "true": testing a
            # site that did not change wastes a minute, skipping one that
            # did change lets a broken build through.
            if changed=$(git diff --name-only HEAD^1 HEAD); then
              echo "$changed"
              if ! echo "$changed" | grep -qE '^(site/|\.github/workflows/site\.yml$)'; then
                site=false
              fi
            fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "Test the site: $site"

  snyk:
    name: Snyk (Open Source)
    needs: changes
    # Skipped (which branch protection counts as passed) only when the
    # `changes` job succeeded AND said the site is untouched. If that job
    # itself failed, run anyway: without `!cancelled()` a failed `needs`
    # would skip this job, and a skip would read as a pass.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: snyk/actions/setup@master
      - name: Snyk test
        run: |
          snyk test \
            --sarif-file-output=../snyk-deps.sarif \
            --severity-threshold=low || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk-deps.sarif') != ''
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-deps

  build-site:
    name: Build site
    needs: changes
    # Same rule as the Snyk job above.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Astro build
        run: npm run build
      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          retention-days: 1
          if-no-files-found: error

# ── Stage 2: Deploy (main only) ──────────────────────────────────────────────

  deploy-site:
    name: Deploy site content
    needs: [snyk, build-site]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get storage account name from infra state
        id: sa
        working-directory: infra
        run: |
          terraform init
          echo "name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT

      - name: Upload site to $web container
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ steps.sa.outputs.name }}" \
              --source ./dist \
              --destination '$web' \
              --overwrite \
              --auth-mode login
            # Hidden directories get dropped between the Astro build and
            # upload-batch, which loses .well-known/ (the Entra
            # publisher-domain verification file). public/ files are
            # copied verbatim anyway, so upload straight from the source
            # tree — independent of any build-tool dotfile behaviour.
            az storage blob upload-batch \
              --account-name "${{ steps.sa.outputs.name }}" \
              --source site/public/.well-known \
              --destination '$web' \
              --destination-path '.well-known' \
              --overwrite \
              --auth-mode login
