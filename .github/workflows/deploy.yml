name: Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Branching strategy
# ─────────────────────────────────────────────────────────────────────────────
#
#   feat/* ──PR──→ dev   Stage 1 only  (validate · scan · build)
#   dev   ──PR──→ main   Stage 1 + Stage 2 plan  (no apply)
#   main  push           Stage 1 + Stage 2 plan + apply + deploy
#   schedule (daily)     Stage 1 only  (nightly CVE / policy sweep)
#
# Stage 1 — Validation  (every event, no Azure credentials required)
#   Checkov · Trivy · tflint · Snyk OSS
#   terraform fmt + validate (per stack, backend=false)
#   Astro build
#
# Stage 2 — Plan & Apply  (main branch only — PR or push)
#   All jobs declare `needs` on every Stage 1 job; nothing touches Azure
#   until every scanner and linter is green.
#   plan runs on both PR-to-main and push-to-main.
#   apply / deploy run on push-to-main only.
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Daily at 06:17 UTC — catches new CVEs and policy rules without a push.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  id-token: write        # OIDC federation to Azure (Stage 2)
  contents: read
  security-events: write # SARIF upload to GitHub Code Scanning (Stage 1)

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

# ═════════════════════════════════════════════════════════════════════════════
# STAGE 1 — VALIDATION
# All jobs run in parallel. No Azure credentials required — pure static
# analysis and a build check. Results feed into GitHub Code Scanning.
# ═════════════════════════════════════════════════════════════════════════════

jobs:

  # ---------------------------------------------------------------------------
  # Checkov — IaC policy and misconfiguration scanner (Palo Alto / Prisma).
  # Catches: public storage, disabled encryption, WAF off, missing HTTPS, etc.
  # Findings appear under Security → Code scanning, not as hard failures,
  # so the job always exits 0. Ratchet soft_fail to false once suppressions
  # in .checkov.yaml are confirmed complete.
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov (IaC policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
          config_file: .checkov.yaml

      - name: Upload SARIF → Code Scanning
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ---------------------------------------------------------------------------
  # Trivy — second-opinion IaC misconfiguration scanner (Aqua Security).
  # Different ruleset to Checkov; running both surfaces gaps each misses.
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy (IaC misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          # Skip node_modules — Trivy picks up Dockerfiles inside dev deps
          # which we don't build. Not an issue in CI (no npm install here)
          # but keeps local and CI runs consistent.
          skip-dirs: site/node_modules

      - name: Upload SARIF → Code Scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # tflint — Terraform-specific linter with the azurerm plugin.
  # Catches: deprecated args, invalid SKUs, naming violations, unused vars.
  # Matrix runs all four stacks in parallel.
  # ---------------------------------------------------------------------------
  tflint:
    name: tflint (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [infra, dns, identity, data-platform]
    steps:
      - uses: actions/checkout@v6

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init tflint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tflint
        run: |
          tflint --format sarif --chdir ${{ matrix.stack }} \
            > tflint-${{ matrix.stack }}.sarif || true

      - name: Upload SARIF → Code Scanning
        if: always() && hashFiles(format('tflint-{0}.sarif', matrix.stack)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tflint-${{ matrix.stack }}.sarif
          category: tflint-${{ matrix.stack }}

  # ---------------------------------------------------------------------------
  # Snyk Open Source — npm dependency CVE scanner.
  # Surfaces the vulnerabilities that Dependabot version-bump PRs close.
  # ---------------------------------------------------------------------------
  snyk:
    name: Snyk (Open Source)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - uses: snyk/actions/setup@master

      - name: Snyk test
        run: |
          snyk test \
            --sarif-file-output=../snyk-deps.sarif \
            --severity-threshold=low || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload SARIF → Code Scanning
        if: always() && hashFiles('snyk-deps.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-deps

  # ---------------------------------------------------------------------------
  # Terraform fmt + validate — runs against all four stacks with
  # `-backend=false` so no Azure credentials are needed here.
  # The backend is not initialised; providers are downloaded from the
  # registry for type-checking but no state or API calls are made.
  # fmt-check and validate are intentionally in Stage 1 (not inside the
  # plan jobs) so formatting errors block the pipeline before any Azure
  # resources are touched.
  # ---------------------------------------------------------------------------
  validate-terraform:
    name: Validate Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [infra, dns, identity, data-platform]
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init (no backend)
        run: terraform -chdir=${{ matrix.stack }} init -backend=false

      - name: Terraform fmt check
        run: terraform -chdir=${{ matrix.stack }} fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.stack }} validate

  # ---------------------------------------------------------------------------
  # Build site — Astro production build. Validates the frontend compiles
  # cleanly and produces the dist/ artifact used by deploy-site.
  # Artifact upload is skipped on the daily schedule (nothing to deploy).
  # ---------------------------------------------------------------------------
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Astro build
        run: npm run build

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 1
          if-no-files-found: error

# ═════════════════════════════════════════════════════════════════════════════
# STAGE 2 — PLAN & APPLY
# Every job here declares `needs` on the complete validation stage.
# Nothing in this stage starts until all of Stage 1 is green.
# Stage 2 is skipped entirely on the daily schedule event.
# ═════════════════════════════════════════════════════════════════════════════

  # ---------------------------------------------------------------------------
  # Infra stack — Front Door, WAF, Storage Account, DNS zone.
  # Outputs the storage account name consumed by deploy-site.
  # ---------------------------------------------------------------------------
  terraform-site:
    name: Terraform site
    needs: [checkov, trivy, tflint, snyk, validate-terraform, build-site]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TFVARS: env/prd.tfvars
    outputs:
      storage_account_name: ${{ steps.tfout.outputs.storage_account_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan -var-file=$TFVARS

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Capture outputs
        id: tfout
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # DNS stack — CNAME records pointing to Front Door.
  # Serialised after infra because it reads cross-stack remote state.
  # ---------------------------------------------------------------------------
  terraform-dns:
    name: Terraform DNS
    needs: [terraform-site]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dns
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # Data-platform stack — ADLS Gen2, Cosmos DB, Data Factory, Databricks.
  # No dependency on terraform-site; runs in parallel with it.
  # ---------------------------------------------------------------------------
  terraform-data-platform:
    name: Terraform data-platform
    needs: [checkov, trivy, tflint, snyk, validate-terraform, build-site]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-platform
    env:
      TFVARS: env/prd.tfvars
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan -var-file=$TFVARS

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # Identity stack — Entra ID Conditional Access policies, Named Locations.
  # Uses a separate SP (AZURE_IDENTITY_CLIENT_ID) with Microsoft Graph perms.
  # Runs in parallel with terraform-site.
  # ---------------------------------------------------------------------------
  terraform-identity:
    name: Terraform identity
    needs: [checkov, trivy, tflint, snyk, validate-terraform, build-site]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_IDENTITY_CLIENT_ID }}
      TFVARS: env/prd.tfvars
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_IDENTITY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan -var-file=$TFVARS

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # Deploy site — uploads the Astro dist/ artifact to Azure Storage $web.
  # Runs only on main push, after terraform-site has applied (so the storage
  # account exists and its name is available as a job output).
  # ---------------------------------------------------------------------------
  deploy-site:
    name: Deploy site content
    needs: [terraform-site]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload site to $web container
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ needs.terraform-site.outputs.storage_account_name }}" \
              --source ./dist \
              --destination '$web' \
              --overwrite \
              --auth-mode login
