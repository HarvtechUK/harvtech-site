name: Identity

# Tests and plans the identity/ stack. Its jobs do real work only when
# identity/ files change (or the shared scanner config, or this file
# itself).
# Uses a separate service principal (AZURE_IDENTITY_CLIENT_ID) with
# Microsoft Graph permissions for Entra ID / Conditional Access resources.
#
# The workflow itself starts on EVERY pull request into dev or main, and
# the `changes` job below decides whether this stack is affected. The
# reason is branch protection: the jobs here are required checks on main,
# and a required check that never starts blocks the merge for ever
# ("Expected — waiting for status to be reported"). A job that starts and
# is then skipped counts as passed. site.yml has the long version.
#
# feat/* ──PR──→ dev   Stage 1 only
# dev    ──PR──→ main  Stage 1 + Stage 2 plan
# main   push          Stage 1 + Stage 2 plan + apply
# workflow_dispatch    Stage 1 + Stage 2 plan + apply (from main only)
# schedule             Stage 1 only

on:
  push:
    branches: [main, dev]
    paths:
      - 'identity/**'
      - '.checkov.yaml'
      - '.trivyignore'
      - '.tflint.hcl'
      - '.github/workflows/identity.yml'
  # No `paths:` here on purpose (see the note at the top). The paths
  # live in the `changes` job instead; keep the two lists the same.
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

# Serialise runs of this workflow — concurrent runs race each other for
# the Terraform state lock (seen when several Dependabot merges landed
# in quick succession). Queued, not cancelled: every push still gets
# its run, just one at a time.
concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  security-events: write

# Stage 2 uses the identity SP, not the default infra SP.
# Overridden at the job level to avoid leaking to Stage 1.
env:
  ARM_USE_OIDC: true
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

# ── Stage 1: Validation (no Azure credentials) ───────────────────────────────

jobs:

  # Answers one question: does this run need to test the identity/ stack?
  #   push / schedule / manual run -> yes, always (the push trigger has
  #                                   already filtered on paths)
  #   pull request                 -> only if it touches the paths below
  changes:
    name: Identity changed?
    runs-on: ubuntu-latest
    # This job runs on every pull request, so it gets the least it needs:
    # it reads the repository and nothing else (no Azure login, no
    # security-events).
    permissions:
      contents: read
    outputs:
      stack: ${{ steps.diff.outputs.stack }}
    steps:
      # On a pull request GitHub checks out a temporary merge commit: the
      # base branch with the pull request merged in. Its first parent is
      # the base branch, so "first parent vs this commit" is exactly what
      # the pull request changes. Depth 2 fetches that parent too.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Did this run touch the stack?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          stack=true
          if [ "$EVENT" = "pull_request" ]; then
            # If the comparison cannot be made, stay on "true": testing a
            # stack that did not change wastes a minute, skipping one that
            # did change lets it through unchecked.
            if changed=$(git diff --name-only HEAD^1 HEAD); then
              echo "$changed"
              if ! echo "$changed" | grep -qE '^(identity/|\.checkov\.yaml$|\.trivyignore$|\.tflint\.hcl$|\.github/workflows/identity\.yml$)'; then
                stack=false
              fi
            fi
          fi
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "Test the stack: $stack"

  checkov:
    name: Checkov (identity)
    needs: changes
    # Skipped (which branch protection counts as passed) only when the
    # `changes` job succeeded AND said the stack is untouched. If that
    # job itself failed, run anyway: without `!cancelled()` a failed
    # `needs` would skip this job, and a skip would read as a pass.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.stack == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          directory: identity
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
          config_file: .checkov.yaml
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov-identity

  trivy:
    name: Trivy (identity)
    needs: changes
    # Same rule as the Checkov job above.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.stack == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: identity
          format: sarif
          output: trivy.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-identity

  tflint:
    name: tflint (identity)
    needs: changes
    # Same rule as the Checkov job above.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.stack == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Init tflint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tflint
        run: tflint --format sarif --chdir identity > tflint-identity.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('tflint-identity.sarif') != ''
        with:
          sarif_file: tflint-identity.sarif
          category: tflint-identity

  validate-terraform:
    name: Validate Terraform (identity)
    needs: changes
    # Same rule as the Checkov job above.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.stack == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Terraform init (no backend)
        run: terraform -chdir=identity init -backend=false
      - name: Terraform fmt check
        run: terraform -chdir=identity fmt -check -recursive
      - name: Terraform validate
        run: terraform -chdir=identity validate

# ── Stage 2: Plan & Apply (main branch only) ─────────────────────────────────

  terraform-identity:
    name: Terraform identity
    # No `changes` condition needed here: when the four jobs above are
    # skipped, GitHub skips this job with them, and that counts as
    # passed too.
    needs: [checkov, trivy, tflint, validate-terraform]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_IDENTITY_CLIENT_ID }}
      TFVARS: env/prd.tfvars
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_IDENTITY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init
        run: terraform init
      - name: Terraform plan
        run: terraform plan -out=tfplan -var-file=$TFVARS
      - name: Terraform apply
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve tfplan
