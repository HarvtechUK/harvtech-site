name: Modules

# Unit tests for the shared modules in modules/. Every module directory
# is checked (fmt, init, validate); any module with a tests/ folder also
# runs `terraform test`. The tests mock the azurerm provider, so this
# workflow needs no Azure credentials and never touches state.
#
# The stack workflows (infra, dns, portal-platform, data-platform) also
# trigger on modules/** and plan against live state. That catches a
# module change that would alter real infrastructure; this workflow
# catches a module that is wrong on its own terms.

on:
  push:
    branches: [main, dev]
    paths:
      - 'modules/**'
      - '.github/workflows/modules.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'modules/**'
      - '.github/workflows/modules.yml'
  workflow_dispatch:

concurrency:
  group: modules-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
      - name: List module directories
        id: list
        # A new module is picked up automatically: no edit to this file.
        run: |
          modules=$(find modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Found: $modules"

  test:
    name: Test (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform validate
      - name: Terraform test
        if: hashFiles(format('modules/{0}/tests/*.tftest.hcl', matrix.module)) != ''
        run: terraform test
