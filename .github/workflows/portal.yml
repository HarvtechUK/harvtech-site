name: Portal

# Build + deploy the FastAPI portal container.
#
# feat/* ──PR──→ dev   build only (validates the Dockerfile builds)
# dev    ──PR──→ main  build only
# main   push          build → push to ACR → update the Container App
# workflow_dispatch    same as a main push (from main only)
#
# Deploy prerequisites (the Container App + registry come from the
# portal-platform Terraform stack; the CI service principal needs, on
# the portal resource group / registry):
#   - AcrPush         to build & push the image into ACR
#   - Container Apps Contributor   to update the running revision
# Grant once, e.g.:
#   az role assignment create --assignee <AZURE_CLIENT_ID> \
#     --role AcrPush --scope <acr resource id>
#   az role assignment create --assignee <AZURE_CLIENT_ID> \
#     --role "Container Apps Contributor" --scope <portal rg id>

on:
  push:
    branches: [main, dev]
    paths:
      - 'portal/**'
      - '.github/workflows/portal.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'portal/**'
      - '.github/workflows/portal.yml'
  workflow_dispatch:

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

# Resource names are deterministic from the naming module — no need to
# read Terraform state to find them.
env:
  ACR: crharvtechportalprduks01
  APP: ca-harvtech-portal-prd-uks-01
  RG: rg-harvtech-portal-prd-uks-01
  IMAGE: portal

jobs:
  # ── Stage 1: build the image (every branch / PR) ──────────────────────────
  # Proves the Dockerfile builds. No Azure, no push — just a local build on
  # the runner, so a broken Dockerfile fails the PR before it can merge.
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the container image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} ./portal

  # ── Stage 2: push + deploy (main only) ────────────────────────────────────
  deploy:
    name: Deploy to Container Apps
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The containerapp commands live in a CLI extension that isn't
      # pre-installed on the runner — add it explicitly (non-interactive).
      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      # az acr build runs the Docker build inside ACR Tasks (server-side),
      # so we don't need to push from the runner or handle registry creds —
      # the OIDC login already authenticates us.
      - name: Build & push image in ACR
        run: az acr build --registry "$ACR" --image "$IMAGE:${{ github.sha }}" ./portal
      # Point the app at our registry, authenticating with its managed
      # identity (the AcrPull role was granted in portal-platform). Safe to
      # run on every deploy — idempotent.
      - name: Configure registry (managed-identity pull)
        run: |
          az containerapp registry set \
            --name "$APP" --resource-group "$RG" \
            --server "$ACR.azurecr.io" --identity system
      # Auth config. The two secrets come from GitHub Actions secrets and
      # are stored as Container App secrets (encrypted at rest); the app
      # env references them by name (secretref) so the values never appear
      # in the env listing. ENTRA_CLIENT_ID is a public identifier, not a
      # secret. Setting ENTRA_CLIENT_ID is what turns auth ON.
      - name: Configure auth secrets + env
        run: |
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
                   --query "properties.configuration.ingress.fqdn" -o tsv)
          az containerapp secret set --name "$APP" --resource-group "$RG" --secrets \
            entra-client-secret="${{ secrets.ENTRA_CLIENT_SECRET }}" \
            session-secret="${{ secrets.SESSION_SECRET }}"
          az containerapp update --name "$APP" --resource-group "$RG" \
            --set-env-vars \
              ENTRA_CLIENT_ID="${{ vars.PORTAL_ENTRA_CLIENT_ID }}" \
              ENTRA_AUTHORITY="https://login.microsoftonline.com/organizations" \
              ENTRA_REDIRECT_URI="https://$FQDN/auth/callback" \
              ENTRA_CLIENT_SECRET="secretref:entra-client-secret" \
              SESSION_SECRET="secretref:session-secret"
      # Ship the real image and move ingress to 8000 (our uvicorn port).
      # Infra bootstraps ingress on 80 to match the placeholder; this is
      # where it becomes 8000 for the real app. Idempotent on re-deploys.
      - name: Roll the Container App to the new image
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/$IMAGE:${{ github.sha }}"
          az containerapp ingress update \
            --name "$APP" --resource-group "$RG" --target-port 8000
