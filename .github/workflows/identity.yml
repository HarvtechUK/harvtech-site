name: Identity

# Triggered only when identity/ files change.
# Uses a separate service principal (AZURE_IDENTITY_CLIENT_ID) with
# Microsoft Graph permissions for Entra ID / Conditional Access resources.
#
# feat/* ──PR──→ dev   Stage 1 only
# dev    ──PR──→ main  Stage 1 + Stage 2 plan
# main   push          Stage 1 + Stage 2 plan + apply
# workflow_dispatch    Stage 1 + Stage 2 plan + apply (from main only)
# schedule             Stage 1 only

on:
  push:
    branches: [main, dev]
    paths:
      - 'identity/**'
      - '.checkov.yaml'
      - '.trivyignore'
      - '.tflint.hcl'
      - '.github/workflows/identity.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'identity/**'
      - '.checkov.yaml'
      - '.trivyignore'
      - '.tflint.hcl'
      - '.github/workflows/identity.yml'
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

# Stage 2 uses the identity SP, not the default infra SP.
# Overridden at the job level to avoid leaking to Stage 1.
env:
  ARM_USE_OIDC: true
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

# ── Stage 1: Validation (no Azure credentials) ───────────────────────────────

jobs:

  checkov:
    name: Checkov (identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bridgecrewio/checkov-action@v12
        with:
          framework: terraform
          directory: identity
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
          config_file: .checkov.yaml
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov-identity

  trivy:
    name: Trivy (identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: identity
          format: sarif
          output: trivy.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-identity

  tflint:
    name: tflint (identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Init tflint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tflint
        run: tflint --format sarif --chdir identity > tflint-identity.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('tflint-identity.sarif') != ''
        with:
          sarif_file: tflint-identity.sarif
          category: tflint-identity

  validate-terraform:
    name: Validate Terraform (identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Terraform init (no backend)
        run: terraform -chdir=identity init -backend=false
      - name: Terraform fmt check
        run: terraform -chdir=identity fmt -check -recursive
      - name: Terraform validate
        run: terraform -chdir=identity validate

# ── Stage 2: Plan & Apply (main branch only) ─────────────────────────────────

  terraform-identity:
    name: Terraform identity
    needs: [checkov, trivy, tflint, validate-terraform]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_IDENTITY_CLIENT_ID }}
      TFVARS: env/prd.tfvars
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_IDENTITY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init
        run: terraform init
      - name: Terraform plan
        run: terraform plan -out=tfplan -var-file=$TFVARS
      - name: Terraform apply
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve tfplan
