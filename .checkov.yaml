framework:
  - terraform

# Where to scan from the repo root.
directory:
  - infra
  - dns
  - identity
  - data-platform

# Soft fail keeps the workflow green even when checks fail — we'll ratchet
# this to fail-on-high after we've worked through the deferred items
# (Diagnostic Settings for logging, service-tag origin restriction).
soft-fail: true

# Output both to console (for human review in workflow logs) and SARIF
# (for upload into the GitHub Security tab via Code Scanning).
output:
  - cli
  - sarif

# --- Deliberate suppressions ---
# Every entry below has a one-line reason. Audit before adding new ones.
skip-check:
  # The static-site $web container IS public by design — that's the entire
  # reason this storage account exists. Public anonymous read is enabled at
  # the container level, not at the account level (we keep
  # allow_nested_items_to_be_public = false).
  - CKV_AZURE_59

  # Storage logging is deferred — proper fix is a Log Analytics workspace
  # plus Diagnostic Settings, which deserves its own commit (introduces new
  # resources). Tracking as a follow-up; revisit and remove this skip once
  # diag settings land.
  - CKV_AZURE_33

  # Geo-redundant replication doubles the storage cost. For a static
  # portfolio site with content recoverable from git, LRS is the right
  # trade. Re-evaluate if/when there's stateful content that can't be
  # rebuilt from source.
  - CKV_AZURE_206

  # No private endpoint on the origin: Front Door Standard SKU does not
  # support Private Link to origin — that's a Premium-tier feature
  # (~£175/mo uplift). Documented in waf.tf. The follow-up commit on
  # AZU-0012 (Trivy) instead locks origin access down via the
  # AzureFrontDoor.Backend service tag.
  - CKV2_AZURE_33

  # Customer-managed keys via Key Vault: Microsoft-managed keys are
  # adequate for a portfolio site with no regulated data. CMK adds Key
  # Vault management overhead, an additional Key Vault to maintain, and
  # rotation responsibility that's not earning its keep here.
  - CKV2_AZURE_1
