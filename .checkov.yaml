framework:
  - terraform

# Where to scan from the repo root.
directory:
  - infra
  - dns
  - identity
  - data-platform

# Soft fail keeps the workflow green even when checks fail — we'll ratchet
# this to fail-on-high after we've worked through the deferred items
# (Diagnostic Settings for logging, service-tag origin restriction).
soft-fail: true

# Output both to console (for human review in workflow logs) and SARIF
# (for upload into the GitHub Security tab via Code Scanning).
output:
  - cli
  - sarif

# --- Deliberate suppressions ---
# Every entry below has a one-line reason. Audit before adding new ones.
skip-check:
  # The static-site $web container IS public by design — that's the entire
  # reason this storage account exists. Public anonymous read is enabled at
  # the container level, not at the account level (we keep
  # allow_nested_items_to_be_public = false).
  - CKV_AZURE_59

  # Queue-service Storage Analytics logging. Storage logging now ships
  # to Log Analytics via Diagnostic Settings (infra/observability.tf) —
  # but this check only recognises the classic `queue_properties.logging`
  # block, which (a) covers queue services none of our storage accounts
  # use, and (b) needs the shared-key data-plane access we deliberately
  # disabled (CKV2_AZURE_40). Suppressed as not-applicable rather than
  # deferred. The blob-service sibling (CKV2_AZURE_21) understands diag
  # settings: the site SA now satisfies it, and the data-platform SA
  # carries a scoped inline skip with its own reasoning.
  - CKV_AZURE_33

  # Geo-redundant replication doubles the storage cost. For a static
  # portfolio site with content recoverable from git, LRS is the right
  # trade. Re-evaluate if/when there's stateful content that can't be
  # rebuilt from source.
  - CKV_AZURE_206

  # No private endpoint on the origin: Front Door Standard SKU does not
  # support Private Link to origin — that's a Premium-tier feature
  # (~£175/mo uplift). Documented in waf.tf. The follow-up commit on
  # AZU-0012 (Trivy) instead locks origin access down via the
  # AzureFrontDoor.Backend service tag.
  - CKV2_AZURE_33

  # Customer-managed keys via Key Vault: Microsoft-managed keys are
  # adequate for a portfolio site with no regulated data. CMK adds Key
  # Vault management overhead, an additional Key Vault to maintain, and
  # rotation responsibility that's not earning its keep here.
  - CKV2_AZURE_1

  # --- data-platform/ suppressions ---
  # All of these are the "would need VNet + Private Link + Premium SKU"
  # family of findings on the data services. Each fix is structurally
  # similar (deploy private DNS + private endpoint + VNet integration)
  # and each adds £20-40/mo per service. For a portfolio that's
  # demonstrating the IaC PATTERN, the cost can't be justified — same
  # call we made for the site SA. Productionisation path is documented
  # in /docs/architecture/data-platform-hld.

  # Data Factory: public network access disabled requires a Managed
  # VNet IR + private endpoints. Cost. The IaC stub stays public for now.
  - CKV_AZURE_104

  # Data Factory: source control via Git. There are no pipelines in the
  # ADF stub yet, so nothing to source-control. When pipelines land
  # they'll go in a sibling repo under git integration.
  - CKV_AZURE_103

  # Cosmos DB: customer-managed keys. Same reasoning as CKV2_AZURE_1 for
  # storage — MS-managed keys are fine for portfolio scope, CMK adds
  # Key Vault management cost.
  - CKV_AZURE_100

  # Cosmos DB: restricted access via IP rules / VNet. Needs VNet.
  - CKV_AZURE_99

  # Cosmos DB: disable public network access. Same — needs private
  # endpoints to remain reachable from the ingestion pipeline.
  - CKV_AZURE_101

  # Cosmos DB: VNet filter restricts management plane. Needs VNet.
  - CKV_AZURE_132

  # Databricks: data-plane <-> control-plane Private Link. Premium tier
  # feature (~£175/mo workspace uplift before any compute). Standard
  # tier with public access is the right portfolio trade-off.
  - CKV_AZURE_158

  # Data Factory: encrypted with customer-managed key. Same CMK
  # reasoning as CKV_AZURE_100.
  - CKV2_AZURE_15
